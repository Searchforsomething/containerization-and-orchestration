apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "shop.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  {{- if .Values.priorityClasses.enabled }}
  priorityClassName: {{ (index .Values.priorityClasses .Values.postgres.priorityClass).name }}
  {{- end }}
  enablePDB: {{ not .Values.pdb.enabled }}
  storage:
    size: {{ .Values.postgres.storageSize }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  bootstrap:
    initdb:
      database: shop
      owner: shop
  inheritedMetadata:
    labels:
      tier: critical
      {{- include "shop.labels" . | nindent 6 }}
