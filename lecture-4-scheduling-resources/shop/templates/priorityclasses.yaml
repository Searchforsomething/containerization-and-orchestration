{{- if .Values.priorityClasses.enabled }}
{{- range $key := list "critical" "standard" "batch" }}
{{- with index $.Values.priorityClasses $key }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
value: {{ .value }}
globalDefault: false
preemptionPolicy: {{ .preemptionPolicy | default "PreemptLowerPriority" }}
description: {{ .description | quote }}
{{- end }}
{{- end }}
{{- end }}
