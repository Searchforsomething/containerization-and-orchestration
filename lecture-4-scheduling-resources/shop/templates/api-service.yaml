apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    {{- include "shop.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
