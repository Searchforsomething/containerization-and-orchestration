apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: api
  name: api-monitor
  namespace: default
spec:
  endpoints:
  - interval: 15s
    path: /metrics
    port: http
    scrapeTimeout: 10s
  - interval: 15s
    path: /health
    port: http
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - default
  selector:
    matchLabels:
      app: api
