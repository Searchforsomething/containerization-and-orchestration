apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: {{ .Values.api.serviceType | default "ClusterIP" }}
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      {{- if eq .Values.api.serviceType "NodePort" }}
      nodePort: {{ .Values.api.nodePort | default 30080 }}
      {{- end }}