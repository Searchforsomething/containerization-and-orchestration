
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karma
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karma
  template:
    metadata:
      labels:
        app: karma
    spec:
      containers:
        - name: karma
          image: ghcr.io/prymitive/karma:v0.133
          ports:
            - containerPort: 8080
          env:
            - name: ALERTMANAGER_URI
              value: "http://prometheus-operator-kube-p-alertmanager.monitoring.svc.cluster.local:9093"
---
apiVersion: v1
kind: Service
metadata:
  name: karma
  namespace: monitoring
spec:
  selector:
    app: karma
  ports:
    - name: http
      port: 8080
      targetPort: 8080
