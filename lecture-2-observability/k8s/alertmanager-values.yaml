alertmanager:
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: webhook
      routes: []
      group_by:
        - alertname
        - service
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 2h

    receivers:
      - name: webhook
        webhook_configs:
          - url: "https://webhook.site/f84fbc03-e596-45a9-8720-c23e5d8fefdf"
            send_resolved: true